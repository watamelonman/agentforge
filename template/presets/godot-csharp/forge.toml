# forge.toml: orchestration + gates. Humans edit this; agents may not (protected).
[project]
name = "@NAME@"
main_branch = "main"
spec = "spec/SPEC.md"
strict_milestones = true          # never start milestone N+1 before N is fully merged

[agents]
workers = ["claude", "codex"]     # round-robin for cards with agent = "any"; vendors: claude | codex | glm | grok
reviewer = "cross"                # cross = never the author, prefers another CLI | claude | codex | glm | grok | none
# review_pool = ["codex"]         # optional: vendors cross may pick from (default = workers)
planner = "claude"
auditor = "codex"
swap_on_retry = true              # attempt 3+ rotates to another vendor in workers

[agents.claude]
bin = "claude"
model = ""                        # "" = CLI default; e.g. "opus" or "sonnet"
max_turns = 60
review_max_turns = 25
max_budget_usd = 4.0              # per run; only meaningful for API billing
timeout_min = 40
extra_args = []
allow_overage = false             # true = accept paid Claude overage; false stops the run instead

[agents.codex]
bin = "codex"
model = ""
timeout_min = 40                  # codex exec has no max-turns flag; wall clock is the cap
network_access = true             # workers: -c sandbox_workspace_write.network_access=true (NuGet)
extra_args = []                   # e.g. ["-c", "model_reasoning_effort=\"high\""]

# GLM (Z.ai) through Claude Code - opt-in. Add "glm" to workers (or review_pool) to use it.
# Key: ZAI_API_KEY in the env or ~/.config/agentforge/zai.env (chmod 600). Your code is sent
# to Z.ai (Zhipu, PRC jurisdiction). See docs/VENDORS.md before enabling.
# [agents.glm]
# bin = "claude"                    # Claude Code CLI, run with a private Z.ai environment
# model = "glm-5.3"                 # ANTHROPIC_MODEL + opus/sonnet mapping; "glm-5.3[1m]" = 1M ctx
# haiku_model = "glm-5.3-flash"     # background/small tasks
# base_url = "https://api.z.ai/api/anthropic"
# key_env = "ZAI_API_KEY"
# key_file = "~/.config/agentforge/zai.env"
# config_dir = "~/.config/agentforge/glm-claude"   # CLAUDE_CONFIG_DIR, kept apart from ~/.claude
# max_turns = 60
# review_max_turns = 25
# timeout_min = 40
# extra_args = []

# OpenCode models - opt-in. Each table with harness = "opencode" is one vendor (one model);
# add its name to workers / review_pool or pin cards to it. Runs inside bubblewrap.
# See docs/VENDORS.md ("OpenCode") and docs/LIMITS.md (monthly_usd allowance windows).
# [agents.oc-kimi]
# harness = "opencode"
# model = "opencode-go/kimi-k3"     # `opencode models` lists exact ids
# monthly_usd = 60                  # optional: this model's monthly allowance at API prices
# extra_rw = ["~/.nuget", "~/.dotnet"]   # dotnet caches must be writable inside the sandbox
# timeout_min = 40

[budget]
max_attempts = 4                  # worker attempts per task (gate + review loops)
max_total_usd = 150.0             # stop scheduling when estimated Claude spend reaches this
max_agent_runs = 400
max_gate_output_lines = 60        # trimmed gate logs fed back = fewer wasted tokens
max_review_diff_chars = 60000
[context]                         # context pack: spec sections/decisions the card cites (docs/CONTEXT_PACK.md)
enabled = true
always_spec = []                  # e.g. ["2"]; costs its size on every agent turn
decision_index = false
max_chars = 16000

[engine]
name = "godot4-csharp"
godot_bin = "godot-mono"          # .NET build of Godot (Arch: godot-mono; Fedora: official .NET binary)

[setup]
restore = "dotnet restore Game.Core.Tests/Game.Core.Tests.csproj && dotnet restore @NAME@.csproj"
timeout_sec = 600                 # restore runs in each worktree before workers, outside any sandbox

[gates]
order = ["policy", "layers", "format", "build", "test", "godot_build"]
timeout_sec = 900
[gates.cmd]
format      = "dotnet format Game.Core/Game.Core.csproj --verify-no-changes && dotnet format Game.Core.Tests/Game.Core.Tests.csproj --verify-no-changes"
build       = "dotnet build Game.Core.Tests/Game.Core.Tests.csproj -c Debug -warnaserror -nologo -v q"
test        = "dotnet test Game.Core.Tests/Game.Core.Tests.csproj --no-build -nologo -v q"
godot_build = "dotnet build @NAME@.csproj -warnaserror -nologo -v q"
# godot_import = "tools/godot_check.sh import"   # optional: headless import of scenes/scripts

[layers]                          # first path component = layer
root = "."
[layers.allow]
"Game.Core" = []
"Game.Core.Tests" = ["Game.Core"]
src = ["Game.Core"]
[layers.forbid_patterns]
"Game.Core" = ['using\s+Godot', '\bGodot\.', '\bSystem\.Random\b', 'new\s+Random\s*\(', '\bRandom\.Shared\b', 'DateTime\.(Now|UtcNow)', 'Environment\.TickCount', 'Stopwatch']

[policy]
test_globs = ["Game.Core.Tests/**"]
source_globs = ["Game.Core/**", "src/**"]
scene_globs = ["**/*.tscn", "**/*.tres", "**/*.scn", "project.godot", "*.csproj", "**/*.csproj"]
max_scene_diff_lines = 40
protected = ["AGENTS.md", "CLAUDE.md", "forge.toml", "schemas/**", "prompts/**", ".claude/**",
             ".codex/**", "spec/**", "tasks/**", "Directory.Build.props", ".editorconfig", "tools/**"]
always_allowed = ["docs/**", "CHANGELOG.md", "content/**"]
forbid_added = ['\bTODO\b', '\bFIXME\b', 'NotImplementedException', '#pragma\s+warning\s+disable', 'SuppressMessage', '\bnull!']
skip_markers = ['Skip\s*=', '\[Fact\(Skip', '\[Ignore', '#if\s+false']
test_detection = ['Environment\.GetEnvironmentVariable\("(TEST|CI|FORGE)', 'InternalsVisibleTo', 'IsTestRun']
assert_regex = '\bAssert\.|\bShould\(|\.Should\w*\('
max_file_lines = 400
max_diff_lines = 1200
doc_check = false                 # XML docs enforced by the compiler (CS1591 as error) instead
gd_strict_typing = false
